---
- name: (SNMP) Create node (check mode)
  orion_discover_node: &discover_snmp_node
    hostname: "{{ orion_test_solarwinds_server }}"
    username: "{{ orion_test_solarwinds_username }}"
    password: "{{ orion_test_solarwinds_password }}"
    ip_address: "{{ orion_test_node_ip_address }}"
    polling_method: SNMP
    snmp_version: 3
    snmp_credential_set: "{{ orion_test_node_snmpv3_credential_set }}"
    interface_filter:
      - op: '!Regex'
        val: '^lo'
  delegate_to: localhost
  check_mode: true
  register: snmp_discover_01

- name: (SNMP) Create node
  orion_discover_node:
    <<: *discover_snmp_node
  delegate_to: localhost
  register: snmp_discover_02

- name: (SNMP) Create node (check) (idempotence)
  orion_discover_node:
    <<: *discover_snmp_node
  delegate_to: localhost
  check_mode: true
  register: snmp_discover_03

- name: (SNMP) Create node (idempotence)
  orion_discover_node:
    <<: *discover_snmp_node
  delegate_to: localhost
  register: snmp_discover_04

- name: (SNMP) Create node asserts
  ansible.builtin.assert:
    that:
      - snmp_discover_01.changed
      - snmp_discover_02.changed
      - snmp_discover_02.orion_node is defined and snmp_discover_02.orion_node | length > 0
      - snmp_discover_02.discovered is defined and snmp_discover_02.discovered | length > 0
      - snmp_discover_02.discovered | selectattr('DisplayName', 'search', '- lo') | length == 0
      - not snmp_discover_03.changed
      - not snmp_discover_04.changed

- name: (SNMP) Delete node
  orion_node:
    hostname: "{{ orion_test_solarwinds_server }}"
    username: "{{ orion_test_solarwinds_username }}"
    password: "{{ orion_test_solarwinds_password }}"
    state: absent
    ip_address: "{{ orion_test_node_ip_address }}"
  delegate_to: localhost
  register: snmp_delete_01

- name: (SNMP) Delete node asserts
  ansible.builtin.assert:
    that:
      - snmp_delete_01.changed
...
